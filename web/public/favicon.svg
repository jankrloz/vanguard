<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="prismA" x1="32" y1="6" x2="10" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#006680" />
    </linearGradient>
    <linearGradient id="prismB" x1="32" y1="6" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#003B4A" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="32" y1="20" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Backing -->
  <rect width="64" height="64" rx="14" fill="#09090B" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#27272A" stroke-width="1" />

  <!-- Stealth Geometric Delta Shield -->
  <g filter="url(#glow)">
    <!-- Left Facet -->
    <path d="M32 10 L14 50 L32 42 Z" fill="url(#prismA)" />
    <!-- Right Facet -->
    <path d="M32 10 L50 50 L32 42 Z" fill="url(#prismB)" />
    <!-- Center Core Seam -->
    <path d="M32 10 L32 42" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
    <!-- Base Notch -->
    <path d="M24 45.5 L32 42 L40 45.5" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>

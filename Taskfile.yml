version: '3'

vars:
  BIN: bin/vanguard
  INSTALL_DIR: '{{.HOME}}/.local/bin'
  VERSION: '{{.VERSION | default "0.4.0"}}'
  DIST: 'dist'

tasks:
  default:
    desc: Build all artifacts (web and Go binary)
    cmds:
      - task: build

  setup:
    desc: Install dependencies (frontend and semantic-release tooling)
    cmds:
      - pnpm install
      - cmd: cd web && pnpm install

  build:web:
    desc: Build Vite+ React frontend assets
    cmds:
      - cmd: cd web && (command -v vp >/dev/null 2>&1 && vp build || pnpm run build)
    sources:
      - 'web/src/**/*'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/vite.config.ts'
    generates:
      - 'web/dist/index.html'

  build:go:
    desc: Compile Go backend binary with embedded assets
    deps: [build:web]
    cmds:
      - cmd: go build -ldflags="-s -w -X main.Version={{.VERSION}}" -o {{.BIN}} ./cmd/vanguard
    sources:
      - '**/*.go'
      - 'web/dist/**/*'
    generates:
      - '{{.BIN}}'

  build:
    desc: Full build of frontend and Go binary
    cmds:
      - task: build:web
      - task: build:go

  test:
    desc: Run test suite
    deps: [build:web]
    cmds:
      - go test -v ./...

  install:
    desc: Install the compiled binary to ~/.local/bin (and sync Homebrew cellar if installed) as vanguard, vg, and up
    deps: [build]
    preconditions:
      - sh: 'test -d {{.INSTALL_DIR}}'
        msg: 'Directory {{.INSTALL_DIR}} does not exist. Please create it or set INSTALL_DIR.'
    cmds:
      - rm -f {{.INSTALL_DIR}}/vanguard
      - cp {{.BIN}} {{.INSTALL_DIR}}/vanguard
      - chmod +x {{.INSTALL_DIR}}/vanguard
      - ln -sf {{.INSTALL_DIR}}/vanguard {{.INSTALL_DIR}}/vg
      - ln -sf {{.INSTALL_DIR}}/vanguard {{.INSTALL_DIR}}/up
      - |
        if [ -L /opt/homebrew/bin/vanguard ]; then
          CELLAR_BIN=$(readlink -f /opt/homebrew/bin/vanguard 2>/dev/null || true)
          if [ -n "$CELLAR_BIN" ] && [ -w "$(dirname "$CELLAR_BIN")" ]; then
            chmod u+w "$CELLAR_BIN" 2>/dev/null || true
            cp -f {{.BIN}} "$CELLAR_BIN"
            chmod 555 "$CELLAR_BIN"
          fi
        fi
      - 'echo "Installed vanguard to {{.INSTALL_DIR}}/vanguard (aliases: vg, up)"'

  release:build:
    desc: Cross-compile Go binaries for all release targets with embedded assets
    deps: [build:web]
    cmds:
      - mkdir -p {{.DIST}}
      - GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version={{.VERSION}}" -o {{.DIST}}/vanguard_darwin_arm64 ./cmd/vanguard
      - GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version={{.VERSION}}" -o {{.DIST}}/vanguard_darwin_amd64 ./cmd/vanguard
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version={{.VERSION}}" -o {{.DIST}}/vanguard_linux_amd64 ./cmd/vanguard
      - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version={{.VERSION}}" -o {{.DIST}}/vanguard_linux_arm64 ./cmd/vanguard

  release:package:
    desc: Package release archives (.tar.gz) and generate checksums.txt
    deps: [release:build]
    cmds:
      - |
        cd {{.DIST}}
        for target in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
          rm -rf tmp_${target}
          mkdir -p tmp_${target}
          cp vanguard_${target} tmp_${target}/vanguard
          chmod +x tmp_${target}/vanguard
          cp ../README.md tmp_${target}/
          [ -f ../LICENSE ] && cp ../LICENSE tmp_${target}/
          tar -czf vanguard_{{.VERSION}}_${target}.tar.gz -C tmp_${target} .
          rm -rf tmp_${target} vanguard_${target}
        done
        if command -v shasum >/dev/null 2>&1; then
          shasum -a 256 vanguard_{{.VERSION}}_*.tar.gz > checksums.txt
        else
          sha256sum vanguard_{{.VERSION}}_*.tar.gz > checksums.txt
        fi
        echo "Release archives and checksums created in {{.DIST}}:"
        ls -la vanguard_{{.VERSION}}_*.tar.gz checksums.txt

  release:formula:
    desc: Generate Homebrew formula for Vanguard and optionally sync to tap
    deps: [release:package]
    cmds:
      - ./scripts/update-formula.sh {{.VERSION}}

  release:dry:
    desc: Run semantic-release in dry-run mode to inspect next version and changelog
    cmds:
      - pnpm exec semantic-release --dry-run

  release:
    desc: Run automated semantic release locally (requires GITHUB_TOKEN)
    cmds:
      - pnpm exec semantic-release

  run:
    desc: Run Vanguard dashboard with Touch ID authentication
    deps: [build]
    cmds:
      - ./{{.BIN}}

  dev:
    desc: Run in development mode (with live HMR)
    cmds:
      - echo "Starting development server..."
      - go run ./cmd/vanguard --dev

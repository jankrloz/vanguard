version: '3'

vars:
  BIN: bin/vanguard
  INSTALL_DIR: '{{.HOME}}/.local/bin'

tasks:
  default:
    desc: Build all artifacts (web and Go binary)
    cmds:
      - task: build

  setup:
    desc: Install frontend dependencies
    cmds:
      - cmd: cd web && pnpm install

  build:web:
    desc: Build Vite+ React frontend assets
    cmds:
      - cmd: cd web && vp build
    sources:
      - 'web/src/**/*'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/vite.config.ts'
    generates:
      - 'web/dist/index.html'

  build:go:
    desc: Compile Go backend binary with embedded assets
    deps: [build:web]
    cmds:
      - cmd: go build -ldflags="-s -w" -o {{.BIN}} ./cmd/vanguard
    sources:
      - '**/*.go'
      - 'web/dist/**/*'
    generates:
      - '{{.BIN}}'

  build:
    desc: Full build of frontend and Go binary
    cmds:
      - task: build:web
      - task: build:go

  test:
    desc: Run test suite
    cmds:
      - go test -v ./...

  install:
    desc: Install the compiled binary to ~/.local/bin (and sync Homebrew cellar if installed) as vanguard, vg, and up
    deps: [build]
    preconditions:
      - sh: 'test -d {{.INSTALL_DIR}}'
        msg: 'Directory {{.INSTALL_DIR}} does not exist. Please create it or set INSTALL_DIR.'
    cmds:
      - rm -f {{.INSTALL_DIR}}/vanguard
      - cp {{.BIN}} {{.INSTALL_DIR}}/vanguard
      - chmod +x {{.INSTALL_DIR}}/vanguard
      - ln -sf {{.INSTALL_DIR}}/vanguard {{.INSTALL_DIR}}/vg
      - ln -sf {{.INSTALL_DIR}}/vanguard {{.INSTALL_DIR}}/up
      - |
        if [ -L /opt/homebrew/bin/vanguard ]; then
          CELLAR_BIN=$(readlink -f /opt/homebrew/bin/vanguard 2>/dev/null || true)
          if [ -n "$CELLAR_BIN" ] && [ -w "$(dirname "$CELLAR_BIN")" ]; then
            chmod u+w "$CELLAR_BIN" 2>/dev/null || true
            cp -f {{.BIN}} "$CELLAR_BIN"
            chmod 555 "$CELLAR_BIN"
          fi
        fi
      - 'echo "Installed vanguard to {{.INSTALL_DIR}}/vanguard (aliases: vg, up)"'

  run:
    desc: Run Vanguard dashboard with Touch ID authentication
    deps: [build]
    cmds:
      - ./{{.BIN}}

  dev:
    desc: Run in development mode (with live HMR)
    cmds:
      - echo "Starting development server..."
      - go run ./cmd/vanguard --dev

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#09090B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050507" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="prismA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#006680" />
    </linearGradient>
    <linearGradient id="prismB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#003B4A" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="#09090B" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.15" stroke="#27272A" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Center Hero Container -->
  <g transform="translate(120, 80)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="340" height="32" rx="16" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#00F0FF" />
    <text x="30" y="21" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#A1A1AA" letter-spacing="1">
      NEXT-GEN SYSTEM VULNERABILITY SHIELD
    </text>

    <!-- Vanguard Delta Emblem & Title Row -->
    <g transform="translate(0, 56)">
      <!-- Stealth Prism Shield -->
      <g filter="url(#shieldGlow)" transform="translate(0, 4)">
        <path d="M52 10 L16 88 L52 74 Z" fill="url(#prismA)" />
        <path d="M52 10 L88 88 L52 74 Z" fill="url(#prismB)" />
        <path d="M52 10 L52 74" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
        <path d="M38 79.5 L52 74 L66 79.5" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Headline -->
      <text x="120" y="58" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="54" font-weight="900" letter-spacing="6" fill="#F4F4F5">
        VANGUARD
      </text>
      <text x="124" y="94" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="500" fill="#71717A">
        Multi-Package Manager Vulnerability Defense &amp; Upgrade Controller
      </text>
    </g>

    <!-- Feature Cards Row -->
    <g transform="translate(0, 200)">
      <!-- Card 1: CVE Shield -->
      <rect x="0" y="0" width="300" height="130" rx="14" fill="#0E0E12" stroke="#27272A" stroke-width="1.5" />
      <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FF2E93" letter-spacing="1">
        ● MULTI-ENGINE CVE SHIELD
      </text>
      <text x="24" y="70" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#F4F4F5">
        Authoritative Triage
      </text>
      <text x="24" y="98" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#A1A1AA">
        OSV.dev, GHSA, Trivy, osv-scanner &amp; native CLI audits.
      </text>

      <!-- Card 2: Safe SemVer Upgrades -->
      <rect x="330" y="0" width="300" height="130" rx="14" fill="#0E0E12" stroke="#27272A" stroke-width="1.5" />
      <text x="354" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00FF9D" letter-spacing="1">
        ✓ SEMVER RISK GUARD
      </text>
      <text x="354" y="70" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#F4F4F5">
        Safe vs. Major Control
      </text>
      <text x="354" y="98" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#A1A1AA">
        Separates safe minor/patch updates from major breaking changes.
      </text>

      <!-- Card 3: Multi-Manager Unified -->
      <rect x="660" y="0" width="300" height="130" rx="14" fill="#0E0E12" stroke="#27272A" stroke-width="1.5" />
      <text x="684" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1">
        ⚡ 35+ PACKAGE MANAGERS
      </text>
      <text x="684" y="70" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#F4F4F5">
        Web &amp; Headless CLI
      </text>
      <text x="684" y="98" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#A1A1AA">
        Homebrew, npm, pnpm, pip, uv, Cargo, Gem, Go &amp; Topgrade.
      </text>
    </g>

    <!-- Bottom Terminal Snippet Bar -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="960" height="60" rx="12" fill="#000000" stroke="#27272A" stroke-width="1.5" />
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="#00F0FF">
        $ vg check
      </text>
      <text x="135" y="36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" fill="#A1A1AA">
        # Multi-engine CVE &amp; SemVer audit
      </text>
      <text x="480" y="36" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="#00F0FF">
        $ vg apply
      </text>
      <text x="595" y="36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="400" fill="#A1A1AA">
        # Safe upgrades (--major for breaking)
      </text>
    </g>
  </g>
</svg>

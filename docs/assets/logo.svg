<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="prismA" x1="40" y1="12" x2="16" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#006680" />
    </linearGradient>
    <linearGradient id="prismB" x1="40" y1="12" x2="64" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#003B4A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Delta Emblem -->
  <g transform="translate(10, 0)">
    <rect x="4" y="8" width="64" height="64" rx="14" fill="#09090B" stroke="#27272A" stroke-width="1.5" />
    <g filter="url(#glow)">
      <path d="M36 18 L18 58 L36 50 Z" fill="url(#prismA)" />
      <path d="M36 18 L54 58 L36 50 Z" fill="url(#prismB)" />
      <path d="M36 18 L36 50" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
      <path d="M28 53.5 L36 50 L44 53.5" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Logotype -->
  <g transform="translate(94, 24)">
    <text x="0" y="24" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="22" font-weight="800" letter-spacing="4" fill="#F4F4F5">
      VANGUARD
    </text>
    <text x="0" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5" fill="#71717A">
      Vulnerability Shield &amp; Package Orchestrator
    </text>
  </g>
</svg>
